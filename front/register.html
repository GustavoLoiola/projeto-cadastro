<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta</title>
<link rel="stylesheet" href="styles/register.css">
</head>
<body>

  <div class="card">
    <div class="card-header">
      <span class="eyebrow">Conta · Novo cadastro</span>
      <h1>Criar conta</h1>
      <p class="subtitle">Preencha seus dados para começar a usar a plataforma.</p>
    </div>

    <form id="registerForm" novalidate>

      <div id="formBanner" class="banner"></div>

      <div class="field" data-field="nome">
        <label for="nome">Nome completo<span class="required-mark">*</span></label>
        <div class="input-wrap">
          <input type="text" id="nome" name="nome" placeholder="Ex.: João da Silva Nunes" autocomplete="name">
          <span class="status-icon icon-ok">✓</span>
          <span class="status-icon icon-error">!</span>
        </div>
        <span class="error-msg"></span>
      </div>

      <div class="field" data-field="email">
        <label for="email">E-mail<span class="required-mark">*</span></label>
        <div class="input-wrap">
          <input type="email" id="email" name="email" placeholder="voce@exemplo.com" autocomplete="email">
          <span class="status-icon icon-ok">✓</span>
          <span class="status-icon icon-error">!</span>
        </div>
        <span class="error-msg"></span>
      </div>

      <div class="field" data-field="telefone">
        <label for="telefone">Telefone <span class="hint">(opcional)</span></label>
        <div class="input-wrap">
          <input type="tel" id="telefone" name="telefone" placeholder="(11) 91234-5678" autocomplete="tel">
          <span class="status-icon icon-ok">✓</span>
          <span class="status-icon icon-error">!</span>
        </div>
        <span class="error-msg"></span>
      </div>

      <div class="field" data-field="senha">
        <label for="senha">Senha<span class="required-mark">*</span></label>
        <div class="input-wrap password-field">
          <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
          <button type="button" class="toggle-visibility" data-target="senha">MOSTRAR</button>
        </div>
        <div class="strength-bar"><div class="strength-bar-fill" id="strengthFill"></div></div>
        <span class="error-msg"></span>
      </div>

      <div class="field" data-field="confirmarSenha">
        <label for="confirmarSenha">Confirmar senha<span class="required-mark">*</span></label>
        <div class="input-wrap password-field">
          <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a senha" autocomplete="new-password">
          <button type="button" class="toggle-visibility" data-target="confirmarSenha">MOSTRAR</button>
        </div>
        <span class="error-msg"></span>
      </div>

      <button type="submit">Criar conta</button>

      <p class="form-footer">Já tem uma conta? <a href="login.html">Entrar</a></p>
    </form>
  </div>


  <script src="scripts/register.js"></script>
</body>
</html>
