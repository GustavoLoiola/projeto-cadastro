<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de produtos</title>
    <link rel="stylesheet" href="styles/create.css">
</head>
<body>
  <div class="card">
    <div class="card-header">
      <a class="back-link" href="index.html">&larr; Voltar ao painel</a>
      <span class="eyebrow">Estoque · Novo item</span>
      <h1>Cadastro de produto</h1>
      <p class="subtitle">Preencha os dados abaixo para adicionar um item ao catálogo.</p>
    </div>
 
    <form id="productForm">
      <div id="editarBanner" class="banner"></div>
      <div class="field">
        <label for="name">Nome do produto<span class="required-mark">*</span></label>
        <input type="text" id="name" name="name" placeholder="Ex: Calça Jeans Masculina" required>
      </div>
 
      <div class="field">
        <label for="description">Descrição <span class="hint">(opcional)</span></label>
        <input type="text" id="description" name="description" placeholder="Ex: Calça jeans reta masculina azul escuro sem rasgos.">
      </div>
 
      <div class="row">
        <div class="field price-field">
          <label for="price">Preço<span class="required-mark">*</span></label>
          <input type="number" id="price" name="price" placeholder="0,00" step="0.01" min="0" required>
        </div>
 
        <div class="field">
          <label for="quantity">Quantidade<span class="required-mark">*</span></label>
          <input type="number" id="quantity" name="quantity" placeholder="0" step="1" min="0" required>
        </div>
      </div>
 
      <button type="submit">Cadastrar produto</button>
    </form>
  </div>


    <script src="scripts/create.js"></script>

</body>
</html>
